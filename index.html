<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convert Money</title>
    <link rel="icon" href="./Assets/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <script src="./scripts.js" defer></script>
</head>

<body>
    <img class="logo-moedas" src="./Assets/logo.png" atl="logo-convert-money">

    <main>
        <label>
            Converter <b>de</b>:
            <br>
            <select class="currency-select-to-convert">
                <option value="real">R$ Real Brasileiro</option>
                <option value="dolar">US$ Dólar Americano</option>
                <option value="euro">€ Euro</option>
                <option value="libra">£ Libra Esterlina</option>
                <option value="bitcoin">₿ Bitcoin</option>
                <option value="yuan">¥ Yuan</option>
            </select>
        </label>
        <br>
        <label>
            Converter <b>para</b>:
            <br>
            <select class="currency-select">
                <option value="real">R$ Real Brasileiro</option>
                <option value="dolar">US$ Dólar Americano</option>
                <option value="euro">€ Euro</option>
                <option value="libra">£ Libra Esterlina</option>
                <option value="bitcoin">₿ Bitcoin</option>
                <option value="yuan">¥ Yuan</option>
            </select>
        </label>
        <br>
        <label>
            Valor:
            <br>
            <input class="input-values" placeholder="R$ 10.000,00">
        </label>

        <br>

        <button class="convert-button">Converter</button>

        <section>
            <div class="currency-box">
                <img class="currency-image-to-convert" src="./Assets/real.png" alt="logo-moeda-real-a-converter">
                <p class="currency-name-to-convert">Real</p>
                <p class="currency-value-to-convert">R$ 0.0</p>
            </div>

            <img class="arrow-img" src="./Assets/seta.png" alt="seta">

            <div class="currency-box">
                <img class="currency-image" src="./Assets/dolar.png" alt="logo-moeda-dolar-convertida">
                <p class="currency" id="currency-name">Dólar Americano</p>
                <p class="currency-value">US$ 0,00</p>
            </div>
        </section>
    </main>

</body>

</html>
